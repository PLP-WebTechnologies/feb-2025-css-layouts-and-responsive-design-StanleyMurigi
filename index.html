<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Flexbox Page</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    /* Navigation */
    nav {
      background-color: #333;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      flex-wrap: wrap;
    }

    nav .logo {
      font-weight: bold;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 1rem;
      margin: 0;
      padding: 0;
    }

    nav ul li {
      cursor: pointer;
    }

    nav ul li:hover {
      text-decoration: underline;
    }

    /* Main layout */
    .container {
      display: flex;
      flex-direction: row;
      padding: 20px;
      gap: 20px;
    }

    .sidebar {
      flex: 1;
      background: #f4f4f4;
      padding: 10px;
    }

    .content {
      flex: 2;
      background: #e2e2e2;
      padding: 10px;
    }

    /* Media Queries */
    @media (max-width: 600px) {
      nav ul {
        flex-direction: column;
        width: 100%;
      }

      .container {
        flex-direction: column;
      }
    }

    @media (min-width: 601px) and (max-width: 1024px) {
      .container {
        flex-direction: column;
      }
    }

    @media (min-width: 1025px) {
      .container {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">MySite</div>
    <ul>
      <li>Home</li>
      <li>About</li>
      <li
